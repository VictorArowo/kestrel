# Every push to main: test, build both images, push them to GitHub's container registry, and
# roll the server at DEPLOY_HOST onto them.
name: Deploy

on:
  push:
    branches: [main]
    # Journal entries and READMEs don't need a deploy.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run typecheck && npm run lint
        working-directory: web

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [engine, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.image }}
          push: true
          tags: |
            ghcr.io/victorarowo/kestrel-${{ matrix.image }}:latest
            ghcr.io/victorarowo/kestrel-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        run: |
          install -d -m 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Copy the Compose file and Caddy config
        run: scp deploy/compose.yml deploy/Caddyfile deploy/backup.sh deploy@${{ secrets.DEPLOY_HOST }}:/opt/kestrel/
      - name: Pull and restart
        run: |
          # The registry is private; log in on the server with this run's short-lived token.
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh deploy@${{ secrets.DEPLOY_HOST }} \
            "docker login ghcr.io -u ${{ github.actor }} --password-stdin >/dev/null"
          ssh deploy@${{ secrets.DEPLOY_HOST }} '
            set -e
            cd /opt/kestrel
            docker compose pull --quiet
            docker compose up -d --remove-orphans
            docker image prune -f >/dev/null
            docker logout ghcr.io >/dev/null
            docker compose ps --format "table {{.Service}}\t{{.Status}}"
          '
      - name: Check the site answers
        run: |
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null https://kestrel.victorarowo.com/; then echo "site is up"; exit 0; fi
            sleep 6
          done
          echo "site did not answer"; exit 1
